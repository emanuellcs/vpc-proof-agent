# vpc-proof-agent: example configuration
#
# Copy this file to vpc-proof.yaml (or point the --config flag at it) and
# adjust the values. Everything shown here matches the built-in defaults.
# Unknown keys are rejected.
#
# Precedence (highest first): command-line flags > VPC_PROOF_* environment
# variables > this file > defaults.

server:
  # Interface to bind ("0.0.0.0" for all interfaces).
  addr: 0.0.0.0
  # TCP port for the public REST API.
  port: 8080
  # Timeouts expressed as Go duration strings.
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  # Graceful shutdown window for in-flight requests.
  shutdown_timeout: 10s
  # Set both to serve the API over HTTPS.
  tls_cert_file: "" # e.g. /etc/vpc-proof/cert.pem
  tls_key_file: ""  # e.g. /etc/vpc-proof/key.pem

auth:
  # Set to true and provide a token to protect the API.
  enabled: false
  token: "" # e.g. "a-long-random-secret"
  # Endpoints that bypass authentication.
  public_paths:
    - /healthz
    - /readyz
    - /metrics

probes:
  # Expected network layout the probes validate against.
  vpc_cidr: 10.0.0.0/16
  subnet_cidr: 10.0.1.0/24
  # External services used to discover the public IP. The first entry is also
  # used by the outbound-HTTP and clock-skew probes.
  echo_urls:
    - https://checkip.amazonaws.com
  # Hostname resolved to verify DNS resolution works.
  dns_host: amazon.com
  # Overrides the EC2 instance metadata endpoint. When empty, the default
  # link-local address (http://169.254.169.254) is used. Useful for testing
  # against a mock IMDS or for IMDS proxies.
  imds_base_url: ""
  # Per-probe timeout, expressed as a Go duration string.
  timeout: 5s
  # Number of retries for transient probe failures.
  max_retries: 2

cache:
  # How long expensive probe results are cached.
  probe_ttl: 5m

ratelimit:
  # Per-client steady-state and burst request budgets.
  requests_per_minute: 100
  burst: 20

history:
  # How many probe run summaries to keep in memory.
  max_entries: 50
  # When set, the history is periodically flushed to this JSON file.
  disk_path: ""
  # How often the history is flushed to disk.
  flush_interval: 30s

log:
  # One of debug, info, warn, error.
  level: info
  # One of json, console.
  format: json
